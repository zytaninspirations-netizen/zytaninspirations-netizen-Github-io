<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dቦራ Burger & Pizza | Digital Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #FFFFFF;
      --bg-card: #FFF8F5;
      --bg-elevated: #FFEEE6;
      --accent-orange: #FF5500;
      --accent-orange-hover: #E04B00;
      --text-main: #1F1916;
      --text-muted: #665A55;
      --border-color: #FFE0D1;
      --radius-sm: 8px;
      --radius-md: 14px;
      --shadow-sm: 0 4px 12px rgba(255, 85, 0, 0.08);
      --shadow-md: 0 8px 24px rgba(255, 85, 0, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 80px;
    }

    header {
      padding: 24px 20px 16px;
      text-align: center;
      background: linear-gradient(180deg, #FFF3ED 0%, #FFFFFF 100%);
      border-bottom: 1px solid var(--border-color);
    }

    .brand-badge {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .brand-orange {
      color: var(--accent-orange);
    }

    .brand-dark {
      color: var(--text-main);
    }

    .sub-tag {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .contact-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .contact-btn {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      color: var(--accent-orange);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .contact-btn:hover {
      background: var(--accent-orange);
      color: #FFFFFF;
      border-color: var(--accent-orange);
    }

    /* Category Filter Tabs */
    .category-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 16px 20px;
      background: var(--bg-light);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent-orange);
      color: #FFFFFF;
      border-color: var(--accent-orange);
      box-shadow: var(--shadow-sm);
    }

    /* Menu Grid Container */
    .menu-container {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 20px;
      display: grid;
      gap: 16px;
    }

    .menu-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .menu-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent-orange);
    }

    .item-info {
      flex: 1;
    }

    .item-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .item-ingredients {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .item-price {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-orange);
      white-space: nowrap;
      background: #FFFFFF;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    /* Agency & CTA Banner */
    .agency-banner {
      max-width: 800px;
      margin: 40px auto 20px;
      padding: 24px;
      background: linear-gradient(135deg, #FFF3ED 0%, #FFEEE6 100%);
      border: 2px dashed var(--accent-orange);
      border-radius: var(--radius-md);
      text-align: center;
    }

    .agency-banner h3 {
      font-size: 1.2rem;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .agency-banner p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .order-agency-btn {
      background: var(--accent-orange);
      color: #FFFFFF;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 800;
      text-decoration: none;
      display: inline-block;
      box-shadow: var(--shadow-md);
      transition: background 0.2s ease;
    }

    .order-agency-btn:hover {
      background: var(--accent-orange-hover);
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      margin-top: 30px;
    }

    footer a {
      color: var(--accent-orange);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header>
    <div class="brand-badge">
      <span class="brand-orange">Dቦራ</span> <span class="brand-dark">BURGER & PIZZA</span>
    </div>
    <div class="sub-tag">Fresh Ingredients • Authentic Taste</div>
    
    <div class="contact-bar">
      <a class="contact-btn" href="tel:+251966323232">📞 Call: +251 966 323 232</a>
      <a class="contact-btn" href="https://t.me/+251966323232" target="_blank">✈️ Telegram Order</a>
    </div>
  </header>

  <!-- Sticky Category Filter -->
  <nav class="category-tabs" id="categoryTabs">
    <button class="tab-btn active" onclick="filterCategory('all', event)">All / ሁሉንም</button>
    <button class="tab-btn" onclick="filterCategory('breakfast', event)">Breakfast / ቁርስ</button>
    <button class="tab-btn" onclick="filterCategory('burger', event)">Burgers / በርገር</button>
    <button class="tab-btn" onclick="filterCategory('pizza', event)">Pizza / ፒዛ</button>
    <button class="tab-btn" onclick="filterCategory('sandwich', event)">Sandwich / ሳንድዊች</button>
    <button class="tab-btn" onclick="filterCategory('juices', event)">Juices & Drinks / ጁስ እና መጠጦች</button>
  </nav>

  <!-- Main Menu Container -->
  <main class="menu-container" id="menuContainer">
    <!-- Items rendered via JS -->
  </main>

  <!-- Zaytan Order CTA Section -->
  <section class="agency-banner">
    <h3>Want a digital menu like this for your cafe or restaurant?</h3>
    <p>Powered by Zaytan Inspirations — Get your customized dynamic QR system today!</p>
    <a href="https://t.me/Zaytanas" target="_blank" class="order-agency-btn">ORDER NOW</a>
  </section>

  <!-- Footer -->
  <footer>
    <p>Powered by <a href="https://zaytan.site" target="_blank">Zaytan Inspirations</a></p>
  </footer>

  <script>
    const MENU_DATA = [
      // Breakfast / ቁርስ
      { category: 'breakfast', name: 'Scramble Egg / እንቁላል ፍርፍር', price: '180 ETB', ingredients: 'Egg, Tomato, Onion, Green Pepper' },
      { category: 'breakfast', name: 'Special Chechebsa / ቸቸብሳ', price: '220 ETB', ingredients: 'Honey, Egg, Butter, Spicy Pepper' },
      { category: 'breakfast', name: 'Plain Chechebsa / ቸቸብሳ', price: '160 ETB', ingredients: 'Spicy Pepper, Butter' },
      { category: 'breakfast', name: 'Egg Sandwich / እንቁላል ሳንድዊች', price: '150 ETB', ingredients: 'Scrambled Egg, Toast, Veggies' },

      // Burgers / በርገር
      { category: 'burger', name: 'Beef Burger / የበሬ በርገር', price: '280 ETB', ingredients: 'Beef Patty, Lettuce, Tomato, Sauce' },
      { category: 'burger', name: 'Deborah Special Burger / ዴቦራ በርገር', price: '350 ETB', ingredients: 'Double Beef Patty, Cheese, Egg, Fries' },
      { category: 'burger', name: 'Cheese Burger / ቺዝ በርገር', price: '300 ETB', ingredients: 'Beef Patty, Melted Cheese, Veggies' },
      { category: 'burger', name: 'Chicken Burger / የዶሮ በርገር', price: '320 ETB', ingredients: 'Chicken Breast Patty, Mayo, Lettuce' },
      { category: 'burger', name: 'Fish Burger / የዓሳ በርገር', price: '290 ETB', ingredients: 'Fish Patty, Tartar Sauce, Lettuce' },

      // Pizza / ፒዛ
      { category: 'pizza', name: 'Double Pizza / ድብል ፒዛ', price: '480 ETB', ingredients: 'Double Cheese, Double Toppings' },
      { category: 'pizza', name: 'Pizza Chicken / የዶሮ ፒዛ', price: '420 ETB', ingredients: 'Seasoned Chicken, Mozzarella Cheese' },
      { category: 'pizza', name: 'Pizza Beef / የበሬ ፒዛ', price: '400 ETB', ingredients: 'Minced Beef, Onions, Mozzarella Cheese' },
      { category: 'pizza', name: 'Al Tuna Pizza / ቱና ፒዛ', price: '390 ETB', ingredients: 'Tuna Flakes, Onions, Mozzarella Cheese' },
      { category: 'pizza', name: 'Pizza Tuna Fasting / ቱና ጾም ፒዛ', price: '350 ETB', ingredients: 'Tuna, Veggies, Cheese-free Crust' },
      { category: 'pizza', name: 'Pizza Margarita / ማርጋሪታ ፒዛ', price: '320 ETB', ingredients: 'Fresh Tomato Sauce, Mozzarella' },
      { category: 'pizza', name: 'Vegetable Pizza / የትክልት ፒዛ', price: '300 ETB', ingredients: 'Bell Peppers, Onions, Mushrooms, Olives' },
      { category: 'pizza', name: 'Special Fasting Tuna / ስፔሻል ጾም ቱና', price: '370 ETB', ingredients: 'Tuna, Olives, Tomatoes, Spiced Sauce' },

      // Sandwich / ሳንድዊች
      { category: 'sandwich', name: 'Club Sandwich Half / ክለብ ሳንድዊች እኔ', price: '220 ETB', ingredients: 'Chicken, Egg, Cheese, Salad' },
      { category: 'sandwich', name: 'Club Sandwich Full / ክለብ ሳንድዊች ሙሉ', price: '320 ETB', ingredients: 'Double Layer Chicken, Egg, Cheese, Fries' },
      { category: 'sandwich', name: 'Tuna Sandwich / ቱና ሳንድዊች', price: '240 ETB', ingredients: 'Tuna, Mayo, Onions, Lettuce' },
      { category: 'sandwich', name: 'Chicken Sandwich / የዶሮ ሳንድዊች', price: '260 ETB', ingredients: 'Grilled Chicken, Veggies, Sauce' },
      { category: 'sandwich', name: 'Vegetable Sandwich / የትክልት ሳንድዊች', price: '180 ETB', ingredients: 'Avocado, Tomato, Cucumber, Lettuce' },

      // Juices & Drinks / ጁስ እና መጠጦች
      { category: 'juices', name: 'Special Spris / ስፕሪስ', price: '120 ETB', ingredients: 'Avocado, Mango, Papaya Layered' },
      { category: 'juices', name: 'Orange Juice / ብርቱካን ጁስ', price: '130 ETB', ingredients: 'Freshly Squeezed Orange' },
      { category: 'juices', name: 'Mango Juice / ማንጎ ጁስ', price: '110 ETB', ingredients: 'Pure Mango Pulp' },
      { category: 'juices', name: 'Avocado Juice / አቮካዶ ጁስ', price: '110 ETB', ingredients: 'Fresh Avocado Blend' },
      { category: 'juices', name: 'Soft Drinks / ለስላሳ መጠጦች', price: '50 ETB', ingredients: 'Coca-Cola, Fanta, Sprite' },
      { category: 'juices', name: 'Water 1/2 Liter / ውኃ 0.5L', price: '30 ETB', ingredients: 'Mineral Water' },
      { category: 'juices', name: 'Water 1 Liter / ውኃ 1L', price: '50 ETB', ingredients: 'Mineral Water' }
    ];

    function renderMenu(items) {
      const container = document.getElementById('menuContainer');
      container.innerHTML = items.map(item => `
        <div class="menu-card">
          <div class="item-info">
            <div class="item-title">${item.name}</div>
            <div class="item-ingredients">${item.ingredients}</div>
          </div>
          <div class="item-price">${item.price}</div>
        </div>
      `).join('');
    }

    function filterCategory(cat, evt) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (evt && evt.target) evt.target.classList.add('active');
      
      if (cat === 'all') {
        renderMenu(MENU_DATA);
      } else {
        const filtered = MENU_DATA.filter(item => item.category === cat);
        renderMenu(filtered);
      }
    }

    // Initial Load
    renderMenu(MENU_DATA);
  </script>
</body>
</html>
