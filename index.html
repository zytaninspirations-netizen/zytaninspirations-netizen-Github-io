<style>
:root{--bg:#0a0e0c;--bg2:#0f1512;--card:#131b17;--card2:#18221d;--line:rgba(255,255,255,.09);--tx:#eef2e9;--mut:#9aa89c;--olive:#a6c957;--gold:#f4b942;--coral:#ff6b4a;--grad:linear-gradient(135deg,var(--olive),var(--gold));--r:18px;--shadow:0 24px 60px rgba(0,0,0,.45);--ink:#10170c}
[data-theme=light]{--bg:#f7f6ef;--bg2:#efeee3;--card:#fff;--card2:#faf9f2;--line:rgba(10,20,10,.11);--tx:#122017;--mut:#58665c;--olive:#5f8a1e;--gold:#c98a0b;--shadow:0 20px 50px rgba(30,40,20,.14);--ink:#fff}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:16px/1.65 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 85% -10%,rgba(166,201,87,.16),transparent 70%),radial-gradient(50% 40% at -5% 35%,rgba(244,185,66,.09),transparent 70%)}
h1,h2,h3,h4{font-family:Sora,Inter,sans-serif;line-height:1.14;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82em;background:var(--card2);border:1px solid var(--line);padding:.1rem .4rem;border-radius:6px;word-break:break-all}
main{flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.i{width:1.25em;height:1.25em;flex:none}
.mut{color:var(--mut)}.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.center{text-align:center}
.sec{padding:96px 0}
.sec-head{max-width:680px;margin-bottom:48px}.sec-head.center{margin-inline:auto}
.eyebrow{display:inline-block;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--olive);font-weight:700;margin-bottom:14px}
.sec-head h2{font-size:clamp(1.9rem,4vw,2.9rem);margin-bottom:14px}
.sec-head p{color:var(--mut);font-size:1.05rem}
/* header */
header.site{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.logo{display:flex;align-items:center;gap:10px}.logo img,.logo-mark{width:40px;height:40px;border-radius:11px;object-fit:contain}
.logo b{font-family:Sora;font-size:1.05rem;display:flex;flex-direction:column;line-height:1.05;letter-spacing:-.01em}
.logo b em{font-style:normal;font-weight:500;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--olive)}
nav.main{display:flex;gap:2px;align-items:center}
nav.main a{padding:.5rem .72rem;border-radius:999px;font-size:.88rem;font-weight:500;color:var(--mut);transition:.2s;white-space:nowrap}
nav.main a:hover,nav.main a.on{color:var(--tx);background:rgba(166,201,87,.12)}
.hdr-r{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--tx);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--olive)}
.burger{display:none}
@media(max-width:1120px){
 .burger{display:grid}
 nav.main{position:fixed;inset:72px 0 auto 0;background:var(--bg);flex-direction:column;align-items:stretch;padding:14px 20px 24px;border-bottom:1px solid var(--line);transform:translateY(-120%);transition:.3s;max-height:calc(100vh - 72px);overflow:auto}
 nav.main.open{transform:none}
 nav.main a{padding:.9rem 1rem;font-size:1rem}
 .hdr-r .btn.cta-h{display:none}
}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;padding:.8rem 1.3rem;border-radius:999px;font-weight:600;font-size:.95rem;border:1px solid transparent;cursor:pointer;transition:.25s;white-space:nowrap}
.btn-primary{background:var(--grad);color:#10170c}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(166,201,87,.32)}
.btn-ghost{border-color:var(--line);background:rgba(255,255,255,.03);color:var(--tx)}
.btn-ghost:hover{border-color:var(--olive)}
.btn-wa{background:#25d366;color:#06240f}.btn-tg{background:#2aabee;color:#04202e}
.btn-wa:hover,.btn-tg:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn-danger{background:rgba(255,107,74,.12);color:#ff8a6e;border-color:rgba(255,107,74,.3)}
.btn-sm{padding:.48rem .9rem;font-size:.84rem}
.btn[disabled]{opacity:.55;pointer-events:none}
.cta{display:flex;gap:12px;flex-wrap:wrap}
/* hero */
.hero{position:relative;overflow:hidden;padding:84px 0 70px;--mx:50%;--my:30%}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(500px circle at var(--mx) var(--my),rgba(166,201,87,.13),transparent 60%);pointer-events:none}
#net{position:absolute;inset:0;width:100%;height:100%;opacity:.75}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:10px;padding:.4rem .9rem;border:1px solid var(--line);border-radius:999px;font-size:.8rem;color:var(--mut);background:rgba(255,255,255,.03);margin-bottom:22px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--olive);box-shadow:0 0 0 0 var(--olive);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hero h1{font-size:clamp(2.4rem,5.6vw,4.4rem);margin-bottom:20px}
.lead{font-size:1.15rem;color:var(--mut);max-width:560px;margin-bottom:30px}
.open{display:inline-flex;align-items:center;gap:8px;margin-top:26px;font-size:.84rem;color:var(--mut)}
.open i{width:9px;height:9px;border-radius:50%;background:#888}.open.on i{background:#3ddc84;box-shadow:0 0 10px #3ddc84}
.hero-visual{position:relative;display:grid;place-items:center;min-height:560px}
.phone{width:285px;border-radius:44px;padding:11px;background:linear-gradient(160deg,#2c3d33,#0b110e);box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.12);transform:perspective(900px) rotateY(var(--ry,-9deg)) rotateX(var(--rx,4deg));transition:transform .25s;animation:float 7s ease-in-out infinite}
@keyframes float{50%{translate:0 -12px}}
.screen{border-radius:34px;background:#0d1410;padding:20px 16px 18px;min-height:540px;color:#eef2e9;position:relative;overflow:hidden}
.screen .notch{width:90px;height:22px;background:#000;border-radius:0 0 16px 16px;position:absolute;top:0;left:50%;transform:translateX(-50%)}
.m-h{margin-top:16px}.m-h small{color:#9aa89c;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}.m-h h4{font-size:1.15rem;margin-top:2px}
.m-tabs{display:flex;gap:6px;margin:14px 0}.m-tabs span{font-size:.7rem;padding:.3rem .7rem;border-radius:999px;background:#1a251f}.m-tabs span:first-child{background:var(--grad);color:#10170c;font-weight:700}
.m-it{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:.85rem}
.m-it small{display:block;color:#8a988d;font-size:.7rem}.m-it b{color:#f4b942;font-size:.82rem}
.m-bar{position:absolute;left:14px;right:14px;bottom:14px;background:var(--grad);color:#10170c;border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;font-weight:700;font-size:.85rem}
.float-card{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;font-size:.8rem}
.qr-float{right:-6px;bottom:70px;width:150px;padding:10px;background:#fff;color:#111;animation:float 6s ease-in-out infinite reverse;overflow:hidden}
.qr-float svg{width:100%;height:auto;display:block}
.qr-float p{font-size:.64rem;text-align:center;margin-top:4px;font-weight:700;letter-spacing:.06em}
.qr-float::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--olive);box-shadow:0 0 14px var(--olive);animation:scan 2.6s ease-in-out infinite alternate}
@keyframes scan{from{top:8%}to{top:78%}}
.ord-float{left:-12px;top:120px;display:flex;gap:10px;align-items:center;animation:float 8s ease-in-out infinite}
.ord-float i{width:10px;height:10px;border-radius:50%;background:var(--coral);animation:pulse 1.6s infinite}
.ord-float b{display:block;font-size:.82rem}.ord-float span{color:var(--mut);font-size:.72rem}
@media(max-width:940px){.hero-grid{grid-template-columns:1fr}.hero-visual{min-height:600px}.ord-float{left:0}.qr-float{right:0}}
/* marquee */
.marq{border-block:1px solid var(--line);overflow:hidden;background:rgba(255,255,255,.02)}
.marq-t{display:flex;gap:48px;width:max-content;padding:18px 0;animation:marq 38s linear infinite}
.marq-t span{font-family:Sora;font-weight:600;font-size:1.05rem;color:var(--mut);display:flex;align-items:center;gap:48px;white-space:nowrap}
.marq-t span::after{content:"✦";color:var(--olive)}
@keyframes marq{to{transform:translateX(-50%)}}
/* cards */
.grid{display:grid;gap:20px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:940px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--r);padding:28px;position:relative;transition:.3s}
.card.hov:hover{transform:translateY(-6px);border-color:rgba(166,201,87,.45);box-shadow:var(--shadow)}
.ico{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:rgba(166,201,87,.12);color:var(--olive);margin-bottom:18px}
.ico .i{width:26px;height:26px}
.card h3{font-size:1.2rem;margin-bottom:10px}.card p{color:var(--mut);font-size:.95rem}
.ticks{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.ticks li{display:flex;gap:10px;font-size:.92rem;color:var(--tx)}.ticks .i{color:var(--olive);margin-top:3px;width:1.05em;height:1.05em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center}
.stats b{font-family:Sora;font-size:clamp(2.2rem,5vw,3.4rem);display:block}.stats span{color:var(--mut);font-size:.9rem}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.step{counter-increment:s;position:relative;padding:26px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.step::before{content:"0" counter(s);font-family:Sora;font-weight:800;font-size:2.4rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;margin-bottom:8px}
.step h4{margin-bottom:6px}.step p{color:var(--mut);font-size:.92rem}
@media(max-width:940px){.steps{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.steps{grid-template-columns:1fr}}
.band{border-radius:28px;padding:56px 32px;text-align:center;background:linear-gradient(135deg,rgba(166,201,87,.2),rgba(244,185,66,.14)),var(--card);border:1px solid var(--line);position:relative;overflow:hidden}
.band h2{font-size:clamp(1.8rem,4vw,2.7rem);margin-bottom:12px}.band p{color:var(--mut);max-width:560px;margin:0 auto 26px}
.band .cta{justify-content:center}
.page-hero{padding:76px 0 24px}.page-hero h1{font-size:clamp(2.2rem,5vw,3.6rem);margin-bottom:14px;max-width:820px}.page-hero p{color:var(--mut);font-size:1.12rem;max-width:660px}
/* founders */
.f-card{padding:0;overflow:hidden}
.f-photo{aspect-ratio:4/4.3;background:linear-gradient(160deg,#243a2c,#0e1511);position:relative;overflow:hidden}
.f-photo img{width:100%;height:100%;object-fit:cover;transition:transform .6s}.f-card:hover .f-photo img{transform:scale(1.05)}
.avatar{width:100%;height:100%;display:grid;place-items:center;font:800 4.6rem Sora;background:var(--grad);color:#10170c;opacity:.92}
.f-body{padding:24px}
.roles{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.role{font-size:.72rem;font-weight:700;padding:.25rem .65rem;border-radius:999px;background:rgba(166,201,87,.14);color:var(--olive)}
.soc{display:flex;gap:8px;margin-top:18px}
.soc a{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;transition:.2s}
.soc a:hover{background:var(--olive);color:#10170c;border-color:transparent;transform:translateY(-3px)}
/* packages */
.pk{display:flex;flex-direction:column}.pk.pop{border-color:var(--olive);box-shadow:0 0 0 1px var(--olive),var(--shadow)}
.pk .tag{position:absolute;top:-13px;right:22px;background:var(--grad);color:#10170c;font-size:.72rem;font-weight:800;padding:.3rem .8rem;border-radius:999px}
.pk .price{font-family:Sora;font-size:1.4rem;margin:6px 0 4px}.pk .ticks{flex:1;margin-bottom:24px}
/* portfolio */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:8px;align-items:center;padding:.4rem .9rem;border-radius:999px;border:1px solid var(--line);font-size:.84rem;background:transparent;color:var(--tx);cursor:pointer}
.chip.on,.chip:hover{border-color:var(--olive);background:rgba(166,201,87,.12)}
.chip button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:1rem;line-height:1}
.pf{padding:0;overflow:hidden}.pf-art{height:210px;display:grid;place-items:center;position:relative;color:#fff}
.pf-art .i{width:64px;height:64px;opacity:.9}.pf-art small{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.35);padding:.2rem .6rem;border-radius:999px;font-size:.7rem}
.pf-b{padding:20px 22px 24px}.pf-b span{font-size:.75rem;color:var(--olive);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
/* forms */
.form{display:grid;gap:18px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:640px){.row2,.row3{grid-template-columns:1fr}}
.field{display:grid;gap:6px}.field label{font-size:.84rem;font-weight:600;color:var(--mut)}
.field label i{color:var(--coral);font-style:normal}
input,select,textarea{width:100%;padding:.8rem 1rem;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:.95rem}
textarea{min-height:100px;resize:vertical}option{background:var(--card);color:var(--tx)}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.radio{display:flex;gap:10px;flex-wrap:wrap}.radio label{display:flex;gap:8px;align-items:center;padding:.6rem 1rem;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:.9rem;color:var(--tx)}
.radio input{width:auto}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--mut)}.check input{width:auto;margin-top:5px}
.msg{padding:12px 16px;border-radius:12px;font-size:.9rem}
.msg.err{background:rgba(255,107,74,.12);color:#ff9a82;border:1px solid rgba(255,107,74,.3)}
.note{padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(166,201,87,.07);font-size:.9rem;color:var(--mut);display:flex;gap:12px}
.note .i{color:var(--olive);margin-top:3px}.note.warn{background:rgba(244,185,66,.1);border-color:rgba(244,185,66,.35)}.note.warn .i{color:var(--gold)}
.split{display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:start}@media(max-width:940px){.split{grid-template-columns:1fr}}
.side{position:sticky;top:96px;display:grid;gap:16px}@media(max-width:940px){.side{position:static}}
.contact-btns{display:grid;gap:10px}.contact-btns .btn{justify-content:flex-start;padding:1rem 1.2rem;border-radius:16px}
.hours{width:100%;border-collapse:collapse;font-size:.92rem}.hours td{padding:9px 0;border-bottom:1px solid var(--line)}.hours td:last-child{text-align:right;color:var(--mut)}
.success{text-align:center;padding:40px 24px}.success .big{width:72px;height:72px;border-radius:50%;background:var(--grad);display:grid;place-items:center;margin:0 auto 18px;color:#10170c}.success .big .i{width:34px;height:34px}
/* dashboards */
.dash{padding:40px 20px 80px}.dash-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.dash-head h2{font-size:1.8rem;margin:6px 0}
.badge{display:inline-block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:.25rem .65rem;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
.badge.active,.badge.served,.badge.ready{background:rgba(61,220,132,.14);color:#3ddc84;border-color:rgba(61,220,132,.3)}
.badge.pending,.badge.new{background:rgba(244,185,66,.14);color:var(--gold);border-color:rgba(244,185,66,.35)}
.badge.suspended,.badge.cancelled{background:rgba(255,107,74,.14);color:#ff8a6e;border-color:rgba(255,107,74,.3)}
.badge.preparing{background:rgba(42,171,238,.14);color:#4cc0ff;border-color:rgba(42,171,238,.3)}
.tabs{display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--line);margin:22px 0}
.tabs button{background:none;border:0;color:var(--mut);padding:.8rem 1.1rem;font-weight:600;font-size:.92rem;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--tx);border-color:var(--olive)}.tabs b{background:var(--coral);color:#fff;border-radius:999px;font-size:.7rem;padding:.05rem .45rem;margin-left:6px}
.kpi{padding:22px}.kpi b{font-family:Sora;font-size:2rem;display:block}.kpi span{color:var(--mut);font-size:.85rem}
.tbl-w{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:760px}.tbl th{text-align:left;padding:14px 16px;color:var(--mut);font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line)}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:last-child td{border:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{width:auto;min-width:180px;flex:1}
.ord{padding:20px}.ord-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ord ul{list-style:none;padding:0;margin:10px 0;font-size:.92rem}.ord li{display:flex;justify-content:space-between;padding:4px 0}
.ord-f{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.ord-f select{width:auto}
.item-row{display:flex;gap:14px;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item-row:last-child{border:0}.item-row small{color:var(--mut);display:block}
.row{display:flex;gap:10px;align-items:center}.row.wrap-r{flex-wrap:wrap}

function qrSvg(text,px=300){
  if(typeof qrcode!=='function')return null;
  const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),m=2;let p='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+=`M${c+m} ${r+m}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${px}" height="${px}" viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#000"/></svg>`
}
function fakeQr(){let s=7,p='';const rnd=()=>(s=(s*9301+49297)%233280)/233280,n=21,fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#111"/>`;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){const inF=(r<8&&c<8)||(r<8&&c>12)||(r>12&&c<8);if(!inF&&rnd()>.52)p+=`M${c} ${r}h1v1h-1z`}
  return `<svg viewBox="0 0 21 21" shape-rendering="crispEdges"><rect width="21" height="21" fill="#fff"/><path d="${p}" fill="#111"/>${fin(0,0)}${fin(14,0)}${fin(0,14)}</svg>`}
const menuUrl=id=>(CONFIG.publicUrl||location.href.split('#')[0])+'#/m/'+id;
async function qrPng(svg,title,sub){
  const img=new Image(),url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});
  const S=900,P=70,c=document.createElement('canvas');c.width=S+P*2;c.height=S+P*2+190;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.imageSmoothingEnabled=false;x.drawImage(img,P,P,S,S);
  x.fillStyle='#10170c';x.textAlign='center';x.font='700 58px Sora, Arial, sans-serif';x.fillText(title.slice(0,30),c.width/2,S+P*2+30,S);
  x.fillStyle='#555';x.font='500 36px Inter, Arial, sans-serif';x.fillText(sub,c.width/2,S+P*2+90,S);
  x.fillStyle='#7a9a2e';x.font='600 28px Inter, Arial, sans-serif';x.fillText('Powered by Zaytan Inspirations',c.width/2,S+P*2+145,S);
  URL.revokeObjectURL(url);return new Promise(r=>c.toBlob(r,'image/png'))
}

let heroRaf=0,heroResize=null;
function stopNet(){cancelAnimationFrame(heroRaf);heroResize&&removeEventListener('resize',heroResize);heroResize=null}
function startNet(){
  const c=$('#net'),hero=$('#hero');if(!c)return;
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr=Math.min(devicePixelRatio||1,2),mouse={x:-999,y:-999};
  hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();hero.style.setProperty('--mx',(e.clientX-r.left)+'px');hero.style.setProperty('--my',(e.clientY-r.top)+'px');const px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;hero.style.setProperty('--ry',(-9+px*14)+'deg');hero.style.setProperty('--rx',(4-py*10)+'deg');mouse.x=(e.clientX-r.left)*dpr;mouse.y=(e.clientY-r.top)*dpr});
  if(rm)return;
  const ctx=c.getContext('2d');let w,h,pts=[];
  const col=getComputedStyle(document.documentElement).getPropertyValue('--olive').trim()||'#a6c957';
  heroResize=()=>{const r=c.getBoundingClientRect();w=c.width=r.width*dpr;h=c.height=r.height*dpr;pts=Array.from({length:Math.round(Math.min(72,r.width/16))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.4*dpr,vy:(Math.random()-.5)*.4*dpr}))};
  heroResize();addEventListener('resize',heroResize);
  const D=150*dpr;
  (function frame(){
    if(!document.body.contains(c))return;
    ctx.clearRect(0,0,w,h);ctx.fillStyle=col;ctx.strokeStyle=col;
    for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(p.x,p.y,1.8*dpr,0,6.283);ctx.fill()}
    for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);if(d<D){ctx.globalAlpha=(1-d/D)*.28;ctx.lineWidth=dpr;ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke()}}
      const dm=Math.hypot(pts[i].x-mouse.x,pts[i].y-mouse.y);if(dm<D*1.4){ctx.globalAlpha=(1-dm/(D*1.4))*.5;ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke()}}
    heroRaf=requestAnimationFrame(frame)
  })()
}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);if(e.target.dataset.count)countUp(e.target)}}),{threshold:.12}):null;
function countUp(el){const to=+el.dataset.count,t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/1300);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(s)})(t0)}
function observe(){$$('.reveal:not(.in),[data-count]:not(.cu)').forEach(el=>{if(el.dataset.count)el.classList.add('cu');if(io)io.observe(el);else{el.classList.add('in');if(el.dataset.count)el.textContent=el.dataset.count}})}

async function runTests(){

  const denied=fn=>{try{fn();return false}catch(e){return e.message==='Access denied.'}};
  await t('Owner token cannot call admin endpoints',()=>({pass:denied(()=>API.admin.list(tA)),detail:'admin.list(ownerToken) → 403'}));
  await t('Missing token is rejected',()=>({pass:denied(()=>API.owner.me(null)),detail:'owner.me(null) → 403'}));
  await t('Forged token is rejected',()=>({pass:denied(()=>API.owner.me('0'.repeat(48))),detail:'owner.me(forged) → 403'}));

  await t('Restaurant A cannot edit B’s menu items',()=>{let ok=false;try{API.owner.updateItem(tA,B.menu.items[0].id,{name:'hacked'})}catch(e){ok=e.message==='Item not found.'}sync();return{pass:ok&&db.businesses[B.id].menu.items[0].name==='Test item',detail:'updateItem(A, itemOfB) rejected, name unchanged'}});

  await t('Public menu leaks no private fields',()=>{const m=API.menuPublic(A.id),s=JSON.stringify(m);return{pass:!/phone|owner|auth|hash|salt|notes/i.test(s.replace(/"owner[^"]*":/g,'')),detail:'no phone, owner, password hash or notes in response'}});
  await t('Tampered prices are ignored',()=>{const r=API.placeOrder(A.id,{items:[{id:A.menu.items[0].id,qty:2,price:0.01}],table:'3'});return{pass:r.total===200,detail:'client sent price 0.01 → server total '+r.total}});
  await t('Orders for another business’s item IDs fail',()=>{let ok=false;try{API.placeOrder(A.id,{items:[{id:B.menu.items[0].id,qty:1}],table:'3'})}catch(e){ok=true}return{pass:ok,detail:'cross-tenant item in cart rejected'}});
  await t('Script injection is neutralised',()=>{const v=clean('<img src=x onerror=alert(1)>Café',60);return{pass:!/[<>]/.test(v),detail:'stored as: '+v}});
  await t('Admin token reaches admin endpoints',()=>{try{return{pass:Array.isArray(API.admin.list(tok)),detail:'admin.list(adminToken) → OK'}}catch(e){return{pass:false,detail:e.message}}});
  sync();delete db.businesses[A.id];delete db.businesses[B.id];for(const k of Object.keys(db.orders))if([A.id,B.id].includes(db.orders[k].bizId))delete db.orders[k];save();
  try{sessionStorage.setItem('zt',tok)}catch(e){}
  const last=lsGet('zaytan.last',{});delete last[A.id];lsSet('zaytan.last',last);
  out.innerHTML=res.map(r=>`<div class="test ${r.pass?'pass':'fail'}">${icon(r.pass?'check':'x')}<div><b>${esc(r.name)}</b><small>${esc(r.detail)}</small></div></div>`).join('')+`<p style="margin-top:6px"><b>${res.filter(r=>r.pass).length}/${res.length}</b> passed</p>`
}

const run=async fn=>{try{await fn()}catch(e){toast(e.message||'Something went wrong','err')}};
const showErr=(id,msg)=>{const e=$('#'+id);if(e){e.textContent=msg;e.hidden=false}};
const rerender=()=>route(true);
const ACT={
 theme:()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'),
 burger:()=>{const n=$('#nav'),o=n.classList.toggle('open');$('#burger').innerHTML=icon(o?'x':'menu');$('#navReg').style.display=o?'flex':'none'},
 close:a=>{closeModal()},
 copy:a=>copyText(a.dataset.v),
 pfilter:a=>portfolio(null,null,a.dataset.cat),
 demo:()=>run(demo),
 tgConfirm:a=>{copyText(a.dataset.msg);window.open(CONFIG.telegram,'_blank','noopener')},
 tgContact:()=>{const f=$('form[data-form=contact]');const m=`Hello Zaytan Inspirations! I’m ${clean(f.name.value,60)||'a visitor'}. Topic: ${f.topic.value}.\n${clean(f.msg.value,600)}`;copyText(m);window.open(CONFIG.telegram,'_blank','noopener')},
 logout:()=>{Auth.end();go('#/')},
 otab:a=>{uiO.tab=a.dataset.tab;run(dashboard)},
 atab:a=>{uiA.tab=a.dataset.tab;run(admin)},
 delCat:a=>{if(confirm(`Remove category “${a.dataset.cat}” and all its items?`))run(async()=>{API.owner.delCategory(Auth.token(),a.dataset.cat);dashboard()})},
 delItem:a=>{if(confirm('Delete this item?'))run(async()=>{API.owner.deleteItem(Auth.token(),a.dataset.id);dashboard()})},
 editItem:a=>{const me=API.owner.me(Auth.token()),it=me.menu.items.find(i=>i.id===a.dataset.id);if(!it)return;
  openModal(`<h3>Edit item</h3><form class="form" data-form="editItem"><input type="hidden" name="id" value="${esc(it.id)}"><div class="field"><label>Name</label><input name="name" required maxlength="60" value="${esc(it.name)}"></div><div class="row2"><div class="field"><label>Price (${CONFIG.currency})</label><input name="price" type="number" min="0" step="0.01" required value="${it.price}"></div><div class="field"><label>Category</label><select name="cat">${me.menu.categories.map(c=>`<option ${c===it.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div><div class="field"><label>Description</label><input name="desc" maxlength="160" value="${esc(it.desc)}"></div><div class="acts"><button class="btn btn-primary btn-sm">Save</button><button type="button" class="btn btn-ghost btn-sm" data-act="close">Cancel</button></div></form>`)},
 qrSvg:()=>run(async()=>{const me=API.owner.me(Auth.token());download(`${me.name.replace(/\W+/g,'-')}-menu-qr.svg`,new Blob([qrSvg(menuUrl(me.id),1000)],{type:'image/svg+xml'}))}),
 qrPng:()=>run(async()=>{const me=API.owner.me(Auth.token());download(`${me.name.replace(/\W+/g,'-')}-menu-qr.png`,await qrPng(qrSvg(menuUrl(me.id),1000),me.name,'Scan to view our menu & order'))}),
 qrPrint:()=>run(async()=>{const me=API.owner.me(Auth.token()),svg=qrSvg(menuUrl(me.id),420);const w=window.open('','_blank');if(!w)throw E('Allow pop-ups to print the QR card.');
  w.document.write(`<!doctype html><title>QR card</title><style>body{font-family:Arial,sans-serif;text-align:center;padding:50px}h1{font-size:34px;margin:20px 0 6px}p{color:#555;font-size:18px}small{color:#7a9a2e;font-weight:700}</style>${svg}<h1>${esc(me.name)}</h1><p>Scan to view our menu &amp; order</p><small>Powered by Zaytan Inspirations</small>`);w.document.close();w.focus();setTimeout(()=>w.print(),400)}),
 inc:a=>{const id=a.dataset.id;cart[id]=Math.min(20,(cart[id]||0)+1);refreshCart()},
 dec:a=>{const id=a.dataset.id;cart[id]=Math.max(0,(cart[id]||0)-1);if(!cart[id])delete cart[id];refreshCart()},
 jump:(a,e)=>{e.preventDefault();$('#mc'+a.dataset.i).scrollIntoView({behavior:'smooth'})},
 checkout:()=>checkoutModal(),
 again:()=>route(true),
 bizView:a=>bizModal(a.dataset.id),
 setStatus:a=>run(async()=>{API.admin.setStatus(Auth.token(),a.dataset.id,a.dataset.st);closeModal();toast('Status updated','ok');admin()}),
 delBiz:a=>{if(confirm('Permanently delete this business, its menu and all its orders?'))run(async()=>{API.admin.remove(Auth.token(),a.dataset.id);closeModal();toast('Business deleted','ok');admin()})},
 csv:()=>run(async()=>{const l=API.admin.list(Auth.token());const cols=['id','name','type','owner','phone','city','area','address','service','tables','status','contact','createdAt'];download('zaytan-registrations.csv',new Blob([[cols.join(',')].concat(l.map(b=>cols.map(c=>csvCell(c==='createdAt'?new Date(b[c]).toISOString():b[c])).join(','))).join('\n')],{type:'text/csv'}))}),
 backup:()=>run(async()=>download('zaytan-backup.json',new Blob([API.admin.exportAll(Auth.token())],{type:'application/json'}))),
 runTests:a=>{a.disabled=true;run(()=>runTests()).finally(()=>a.disabled=false)}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act])ACT[a.dataset.act](a,e);else if(e.target.closest('#nav a'))$('#nav').classList.remove('open')});
const CHG={
 avail:el=>run(async()=>{API.owner.updateItem(Auth.token(),el.dataset.id,{available:el.checked});toast(el.checked?'Item available':'Item hidden from customers','ok')}),
 ostatus:el=>run(async()=>{API.owner.setOrderStatus(Auth.token(),el.dataset.id,el.value);toast('Order updated','ok');dashboard()})
};
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el)return CHG[el.dataset.chg](el);if(e.target.id==='ast'){uiA.st=e.target.value;admin()}if(e.target.id==='imp'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>run(async()=>{API.admin.importAll(Auth.token(),String(r.result));toast('Backup restored','ok');admin()});r.readAsText(f)}});
let qT=0;document.addEventListener('input',e=>{if(e.target.id==='aq'){uiA.q=e.target.value;clearTimeout(qT);qT=setTimeout(()=>{admin().then(()=>{const i=$('#aq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}})},250)}});
const FORMS={
 async register(f){const btn=$('#regBtn'),err=$('#regErr');err.hidden=true;btn.disabled=true;
  try{const d=Object.fromEntries(new FormData(f));d.consent=f.consent.checked;const r=await API.register(d);regSuccess(r)}catch(e){showErr('regErr',e.message)}finally{btn.disabled=false}},
 async login(f){$('#logErr').hidden=true;try{await API.loginOwner(f.phone.value,f.password.value);uiO.tab='overview';go('#/dashboard');if(location.hash==='#/dashboard')dashboard()}catch(e){showErr('logErr',e.message)}},
 async adminLogin(f){try{await API.adminLogin(f.password.value);admin()}catch(e){showErr('admErr',e.message)}},
 async adminSetup(f){try{await API.adminSetup(f.password.value);admin()}catch(e){showErr('admErr',e.message)}},
 async adminPw(f){await API.admin.changePw(Auth.token(),f.password.value);f.reset();toast('Admin password updated','ok')},
 async addCat(f){API.owner.addCategory(Auth.token(),f.cat.value);dashboard()},
 async addItem(f){API.owner.addItem(Auth.token(),{name:f.name.value,price:f.price.value,cat:f.cat.value,desc:f.desc.value});toast('Item added','ok');dashboard()},
 async editItem(f){API.owner.updateItem(Auth.token(),f.id.value,{name:f.name.value,price:f.price.value,cat:f.cat.value,desc:f.desc.value});closeModal();toast('Item updated','ok');dashboard()},
 async profile(f){API.owner.updateProfile(Auth.token(),{name:f.name.value,city:f.city.value,area:f.area.value,address:f.address.value,tables:f.tables.value});toast('Profile saved','ok');dashboard()},
 async order(f){try{const items=Object.entries(cart).map(([id,qty])=>({id,qty}));const r=API.placeOrder(mp.id,{items,table:f.table.value,name:f.name.value,phone:f.phone.value,note:f.note.value});cart={};orderDone(r)}catch(e){showErr('ordErr',e.message)}},
 async contact(f){const m=`Hello Zaytan Inspirations! I’m ${clean(f.name.value,60)}. Topic: ${f.topic.value}.\n${clean(f.msg.value,600)}`;window.open(waLink(CONFIG.phoneIntl,m),'_blank','noopener')}
};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();run(()=>FORMS[f.dataset.form](f))});
let lastOrders=-1;
addEventListener('storage',e=>{if(e.key!==KEY)return;const h=location.hash;if(h.startsWith('#/dashboard')){const n=Object.values(load().orders).length;if(lastOrders>=0&&n>lastOrders){toast('🔔 New order received!','ok')}lastOrders=n;dashboard()}else if(h.startsWith('#/admin')&&Auth.resolve(Auth.token()))admin()});

/* ---------- router ---------- */
const ROUTES={'':home,about,founders,services,menus,packages,portfolio,contact,register,login,dashboard,admin,m:menuPage};
const TITLES={'':'Zaytan Inspirations — Technology, Creative & Digital Menus',about:'About Us',founders:'Founders',services:'Services',menus:'Digital Menus',packages:'Promotion Packages',portfolio:'Portfolio',contact:'Contact Us',register:'Register your business',login:'Restaurant login',dashboard:'Dashboard',admin:'Admin'};
function route(){
  stopNet();clearInterval(pollT);closeModal();
  const raw=location.hash.replace(/^#\/?/,''),[path,qs]=raw.split('?'),[name,...rest]=path.split('/');
  const fn=own(ROUTES,name)?ROUTES[name]:null;
  document.body.classList.toggle('bare',name==='m');$('#nav').classList.remove('open');$('#burger').innerHTML=icon('menu');
  $$('#nav a[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===name));
  document.title=TITLES[name]?(name===''?TITLES['']:TITLES[name]+' — Zaytan Inspirations'):'Zaytan Inspirations';
  if(!fn){app.innerHTML=`<section class="sec"><div class="wrap center"><h1>Page not found</h1><p class="mut" style="margin:12px 0 24px">That page doesn’t exist.</p><a class="btn btn-primary" href="#/">Back home</a></div></section>`;return}
  if(name==='dashboard')lastOrders=Object.values(load().orders).length;
  Promise.resolve(fn(rest,new URLSearchParams(qs||''))).then(()=>{observe()}).catch(e=>{console.error(e);toast('Something went wrong loading this page','err')});
  if(arguments[0]!==true)scrollTo(0,0)
}
addEventListener('hashchange',()=>route());
buildShell();route();
setInterval(()=>$$('.open').forEach(el=>{el.outerHTML=openBadge()}),60000);
</script>
</body>
