  const click=e=>{if(moved>6){e.preventDefault();e.stopPropagation();moved=0}};
  wrap.addEventListener('pointerdown',down);addEventListener('pointermove',move);addEventListener('pointerup',up);addEventListener('pointercancel',up);wrap.addEventListener('click',click,true);
  cubeOff=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('pointercancel',up)};
  (function frame(){if(!document.body.contains(el))return;if(!drag){ry+=vy;vy+=((RM?0:.4)-vy)*.02}el.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;cubeRaf=requestAnimationFrame(frame)})()
}

const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);if(e.target.dataset.count)countUp(e.target)}}),{threshold:.1}):null;
function countUp(el){const to=+el.dataset.count,t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/1300);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(s)})(t0)}
function observe(){$$('.reveal:not(.in),[data-count]:not(.cu)').forEach(el=>{if(el.dataset.count)el.classList.add('cu');if(io)io.observe(el);else{el.classList.add('in');if(el.dataset.count)el.textContent=el.dataset.count}})}

   <div class="card"><h3 style="margin-bottom:6px">Customer service hours</h3>${openBadge()}<div style="margin-top:10px">${hoursTable()}</div>${hoursNote()}</div></div></div></section>`
}

/* ---------- registration / order ---------- */
function register(q,params){
  const pre=params.get('service')||'';
  app.innerHTML=head('Order / Register','Order your <span class="grad">digital menu or package</span>.','Fill in your details. When you submit, Telegram opens with your request ready to send to our CEO — then our team contacts you personally.')+`
  <section class="sec" style="padding-top:30px"><div class="wrap split"><div class="card reveal" id="regCard">
   <form class="form" data-form="register" novalidate>
    <h3>Business details</h3>
    <div class="row2"><div class="field"><label for="r1">Business name <i>*</i></label><input id="r1" name="name" required maxlength="80" autocomplete="organization"></div>
    <div class="field"><label for="r2">Business type</label><select id="r2" name="type">${['Café','Restaurant','Bar & lounge','Bakery','Hotel','Other'].map(t=>`<option>${t}</option>`).join('')}</select></div></div>
    <div class="row2"><div class="field"><label for="r3">Owner’s full name <i>*</i></label><input id="r3" name="owner" required maxlength="80" autocomplete="name"></div>
    <div class="field"><label for="r4">Phone number <i>*</i></label><input id="r4" name="phone" required inputmode="tel" placeholder="09XX XXX XXX" autocomplete="tel"></div></div>
    <div class="row3"><div class="field"><label for="r5">City <i>*</i></label><input id="r5" name="city" required maxlength="60" value="Addis Ababa"></div><div class="field"><label for="r6">Sub-city / area <i>*</i></label><input id="r6" name="area" required maxlength="80" placeholder="e.g. Bole"></div><div class="field"><label for="r7">Street / landmark</label><input id="r7" name="address" maxlength="120"></div></div>
    <h3 style="margin-top:8px">Your request</h3>
    <div class="row2"><div class="field"><label for="r8">Service / package <i>*</i></label><select id="r8" name="service">${SERVICE_OPTIONS.map(s=>`<option ${s===pre?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="field"><label for="r9">Number of tables (for menus)</label><input id="r9" name="tables" type="number" min="0" max="300" placeholder="e.g. 12"></div></div>
    <div class="row2"><div class="field"><label for="r10">Instagram / social page</label><input id="r10" name="social" maxlength="100" placeholder="@yourcafe or link"></div>
    <div class="field"><label for="r12">Best time to contact you</label><select id="r12" name="when"><option>Anytime</option><option>Morning</option><option>Afternoon</option><option>Evening</option></select></div></div>
    <div class="field"><label for="r11">Anything else we should know?</label><textarea id="r11" name="notes" maxlength="500" placeholder="Opening date, menu size, goals…"></textarea></div>
    <label class="check"><input type="checkbox" name="consent"><span>I agree that Zaytan Inspirations may contact me about this request.</span></label>
    <div class="msg err" id="regErr" hidden></div>
    <button class="btn btn-tg btn-lg" type="submit">${icon('tg')} Submit &amp; send on Telegram</button>
    <p class="mut" style="font-size:.84rem;margin-top:-6px">Telegram opens with your request addressed to @${CONFIG.orderTg}. Press send there to deliver it.</p>
   </form></div>
   <div class="side reveal"><div class="card"><h3 style="margin-bottom:10px">What happens next</h3><ul class="ticks"><li>${icon('check')}Telegram opens with your request ready.</li><li>${icon('check')}You press send — it goes straight to our CEO.</li><li>${icon('check')}We contact you personally to confirm everything.</li></ul></div>
   <div class="card"><h3 style="margin-bottom:6px">Service hours</h3>${openBadge()}<div style="margin-top:10px">${hoursTable()}</div>${hoursNote()}</div>
   <div class="note tg">${icon('tg')}<div>Prefer WhatsApp? <a href="${CONFIG.whatsapp}" target="_blank" rel="noopener" style="color:var(--olive);text-decoration:underline">Message us there</a> — same team, same hours.</div></div></div></div></section>`
}
let lastMsg='';
function buildOrderMsg(v){
  const L=['🆕 NEW REQUEST — Zaytan website',`Ref: ${v.ref}`,'',`Business: ${v.name} (${v.type})`,`Owner: ${v.owner}`,`Phone: ${v.phone}`,`Location: ${v.area}, ${v.city}${v.address?' – '+v.address:''}`,`Service: ${v.service}`];
  if(v.tables)L.push(`Tables: ${v.tables}`);if(v.social)L.push(`Social: ${v.social}`);L.push(`Best time to contact: ${v.when}`);if(v.notes)L.push('',`Notes: ${v.notes}`);
  return L.join('\n')
}
function regSuccess(msg,ref,name){
  $('#regCard').innerHTML=`<div class="success"><div class="big">${icon('tg')}</div><h2 style="margin-bottom:10px">Almost done — press send in Telegram</h2>
  <p class="mut" style="max-width:520px;margin:0 auto 6px">We’ve opened Telegram with your request for <b style="color:var(--tx)">${esc(name)}</b>, addressed to <b style="color:var(--tx)">@${CONFIG.orderTg}</b>. Press <b style="color:var(--tx)">Send</b> there and our team will contact you.</p>
  <p class="mut" style="font-size:.88rem">Your reference: <code>${esc(ref)}</code></p>
  <div class="cta" style="justify-content:center;margin-top:20px"><button class="btn btn-tg btn-lg" data-act="tgOpen">${icon('tg')} Open Telegram again</button><button class="btn btn-ghost btn-lg" data-act="copyMsg">${icon('copy')} Copy message</button></div>
  <div class="note tg" style="text-align:left;margin-top:20px">${icon('clock')}<div><b style="color:var(--tx)">Telegram opened with an empty message box?</b> Your message is already copied — just paste it and press send.</div></div>
  <pre class="preview">${esc(msg)}</pre>
  <div class="cta" style="justify-content:center"><a class="btn btn-wa btn-sm" target="_blank" rel="noopener" href="${esc(waLink(CONFIG.phoneIntl,msg))}">${icon('wa')} Send on WhatsApp instead</a><a class="btn btn-ghost btn-sm" href="#/">Back to home</a></div>
  <div style="margin-top:18px">${openBadge()}</div>${hoursNote()}</div>`;
  scrollTo({top:0,behavior:'smooth'})
}

/* ---------- setup page: logo & photos ---------- */
function setup(){
  app.innerHTML=head('Logo &amp; photo setup','Add your <span class="grad">logo and photos</span>.','Put the image files in the same folder as index.html, named exactly as shown below. They appear on the site automatically — no code needed.')+`
  <section class="sec" style="padding-top:30px"><div class="wrap" style="max-width:900px"><div class="card reveal">
   <ol class="ticks" style="counter-reset:n;margin-top:0;margin-bottom:10px"><li>${icon('check')}<span>Copy your image files next to <code>index.html</code> (same folder).</span></li><li>${icon('check')}<span>Name them exactly as below — lowercase. <code>.jpg</code>, <code>.jpeg</code>, <code>.png</code> and <code>.webp</code> all work.</span></li><li>${icon('check')}<span>Refresh the page. Square or portrait photos look best; the logo can be any shape.</span></li></ol>
   ${Object.entries(SLOTS).map(([k,S])=>`<div class="srow"><div class="thumb"><img data-slot="${k}" data-fb="${k==='logo'?'logo':'founder'}" alt="${esc(S.label)}"></div><div><b>${esc(S.label)}</b><br><code>${S.file}</code>${S.alt?` <span class="mut" style="font-size:.84rem">or <code>${S.alt}</code></span>`:''}</div><span class="badge" id="st-${k}">checking…</span><label class="btn btn-ghost btn-sm" style="cursor:pointer">Preview a file<input type="file" accept="image/*" data-pick="${k}" hidden></label></div>`).join('')}
   <div class="note" style="margin-top:18px">${icon('eye')}<div><b style="color:var(--tx)">“Preview a file”</b> lets you see a photo on the site right now. It only lasts until you reload — to make it permanent, save the file with the name shown above next to <code>index.html</code>.</div></div></div></div></section>`;
  Object.keys(SLOTS).forEach(k=>probe(k).then(r=>{const b=$('#st-'+k);if(!b)return;if(r==='preview'){b.className='badge pv';b.textContent='Previewing'}else if(r){b.className='badge ok';b.textContent='Found: '+r}else{b.className='badge miss';b.textContent='Not found yet'}}))
}

/* ---------- events ---------- */
const ACT={
 theme:()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'),
 burger:()=>{const n=$('#nav'),o=n.classList.toggle('open');$('#burger').innerHTML=icon(o?'x':'menu');$('#navReg').style.display=o?'flex':'none'},
 top:()=>scrollTo({top:0,behavior:'smooth'}),
 pfilter:a=>portfolio(null,null,a.dataset.cat),
 tgOpen:()=>sendTelegram(lastMsg),
 copyMsg:()=>copyText(lastMsg),
 cfPrev:()=>cfGo(cfIdx-1),cfNext:()=>cfGo(cfIdx+1),cfGo:a=>cfGo(+a.dataset.i),
 est:a=>{const id=a.dataset.id;estSel.has(id)?estSel.delete(id):estSel.add(id);a.classList.toggle('on',estSel.has(id));a.setAttribute('aria-pressed',estSel.has(id));estSummary()},
 dinc:a=>{const k=a.dataset.k;dcart[k]=Math.min(20,(dcart[k]||0)+1);demoRefresh()},
 ddec:a=>{const k=a.dataset.k;dcart[k]=Math.max(0,(dcart[k]||0)-1);if(!dcart[k])delete dcart[k];demoRefresh()},
 dorder:()=>{const d=$('#demo');if(!d||!Object.keys(dcart).length)return;const o=document.createElement('div');o.className='demo-ok';o.innerHTML=`<div><div class="success" style="padding:0"><div class="big">${icon('check')}</div></div><h3 style="margin-bottom:8px">Demo order placed!</h3><p class="mut" style="font-size:.92rem;margin-bottom:18px">This was just a preview — nothing was sent. Your own menu is built and kept up to date by our team.</p><div class="cta" style="justify-content:center"><a class="btn btn-primary btn-sm" href="#/register?service=${encodeURIComponent('Digital Menu (QR code)')}">Order mine</a><button class="btn btn-ghost btn-sm" data-act="dreset">Try again</button></div></div>`;d.appendChild(o)},
 dreset:()=>{dcart={};$('.demo-ok')?.remove();demoRefresh()},
 waContact:()=>{const f=$('form[data-form=contact]'),v=readContact(f);if(v.err)return showErr('conErr',v.err);window.open(waLink(CONFIG.phoneIntl,v.msg),'_blank','noopener')}
};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a&&ACT[a.dataset.act]){ACT[a.dataset.act](a,e);return}
  const fc=e.target.closest('.fc.side');if(fc){cfGo(+fc.dataset.i);return}
  if(e.target.closest('#nav a'))$('#nav').classList.remove('open')
});
document.addEventListener('change',e=>{
  const inp=e.target.closest&&e.target.closest('input[data-pick]');if(!inp)return;
  const f=inp.files[0],k=inp.dataset.pick;if(!f)return;
  if(!/^image\//.test(f.type)){toast('Please choose an image file','err');return}
  if(OVR[k])URL.revokeObjectURL(OVR[k]);OVR[k]=URL.createObjectURL(f);
  buildShell();route(true);toast('Preview applied. To keep it, save the file as '+SLOTS[k].file+' next to index.html.','ok')
});
function readContact(f){const name=clean(f.name.value,60),msg=clean(f.msg.value,600);if(name.length<2)return{err:'Please enter your name.'};if(msg.length<3)return{err:'Please write a short message.'};return{msg:`Hello Zaytan Inspirations! I’m ${name}. Topic: ${f.topic.value}.\n\n${msg}`}}
/* NOTE: handlers are synchronous on purpose, so window.open() (Telegram) stays inside the user's click and isn't blocked as a pop-up. */
const FORMS={
 register(f){
  $('#regErr').hidden=true;
  const v={name:clean(f.name.value,80),type:clean(f.type.value,30),owner:clean(f.owner.value,80),phone:normPhone(f.phone.value),city:clean(f.city.value,60),area:clean(f.area.value,80),address:clean(f.address.value,120),service:clean(f.service.value,80),tables:Math.max(0,Math.min(300,parseInt(f.tables.value)||0)),social:clean(f.social.value,100),when:clean(f.when.value,20),notes:clean(f.notes.value,500),ref:refCode()};
  if(v.name.length<2)return showErr('regErr','Please enter your business name.');
  if(v.owner.length<2)return showErr('regErr','Please enter the owner’s name.');
  if(!v.phone)return showErr('regErr','Please enter a valid phone number, e.g. 0912 345 678.');
  if(!v.city||!v.area)return showErr('regErr','Please enter your city and area / sub-city.');
  if(!SERVICE_OPTIONS.includes(v.service))return showErr('regErr','Please choose a service.');
  if(!f.consent.checked)return showErr('regErr','Please tick the box so we’re allowed to contact you.');
  lastMsg=buildOrderMsg(v);sendTelegram(lastMsg);regSuccess(lastMsg,v.ref,v.name)
 },
 estimate(f){
  $('#estErr').hidden=true;const name=clean(f.name.value,60),phone=normPhone(f.phone.value),biz=clean(f.biz.value,80);
  if(!estSel.size)return showErr('estErr','Select at least one service above.');
  if(name.length<2)return showErr('estErr','Please enter your name.');
  if(!phone)return showErr('estErr','Please enter a valid phone number.');
  const msg=['🧩 CUSTOM PACKAGE REQUEST — Zaytan website',`Ref: ${refCode()}`,'',`Name: ${name}`,`Phone: ${phone}`,biz?`Business: ${biz}`:null,`Interested in: ${[...estSel].join(', ')}`].filter(x=>x!==null).join('\n');
  lastMsg=msg;sendTelegram(msg);toast('Telegram opened — press send to deliver your request (it is also copied)','ok')
 },
 contact(f){
  $('#conErr').hidden=true;const v=readContact(f);if(v.err)return showErr('conErr',v.err);
  lastMsg=v.msg;sendTelegram(v.msg);toast('Telegram opened — press send to deliver your message (it is also copied)','ok')
 }
};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();try{FORMS[f.dataset.form](f)}catch(err){toast(err.message||'Something went wrong','err')}});

/* ---------- router ---------- */
const ROUTES={'':home,about,founders,services,menus,packages,portfolio,contact,register,order:register,setup};
const TITLES={'':'Zaytan Inspirations — Technology, Creative & Digital Menus',about:'About Us',founders:'Founders',services:'Services',menus:'Digital Menus',packages:'Promotion Packages',portfolio:'Portfolio',contact:'Contact Us',register:'Order / Register',order:'Order / Register',setup:'Logo & photo setup'};
function route(keep){
  stopFx();
  const raw=location.hash.replace(/^#\/?/,''),[path,qs]=raw.split('?'),[name]=path.split('/');
  const fn=own(ROUTES,name)?ROUTES[name]:null;curRoute=fn?name:'other';
  $('#nav').classList.remove('open');$('#burger').innerHTML=icon('menu');
  $$('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===(name==='order'?'register':name)));
  document.title=own(TITLES,name)?(name===''?TITLES['']:TITLES[name]+' — Zaytan Inspirations'):'Zaytan Inspirations';
  if(T){T.route=curRoute;if(keep!==true)T.warp()}
  if(!fn){app.innerHTML=`<section class="sec"><div class="wrap center"><h1>Page not found</h1><p class="mut" style="margin:12px 0 24px">That page doesn’t exist.</p><a class="btn btn-primary" href="#/">Back home</a></div></section>`}
  else{try{fn(null,new URLSearchParams(qs||''))}catch(err){console.error(err);toast('Something went wrong loading this page','err')}}
  if(keep!==true){app.classList.remove('page-in');void app.offsetWidth;app.classList.add('page-in');scrollTo({top:0,left:0,behavior:'instant'})}
  hydrate(app);observe();fillQr();if($('#cf'))cfLayout();requestDraw()
}
addEventListener('hashchange',()=>route());
/* splash + boot */
const splash=$('#splash');
let seen=false;try{seen=!!sessionStorage.getItem('zs')}catch(e){}
if(seen)splash.remove();
buildShell();hydrate();route(true);
addEventListener('load',()=>{
  window.boot3d&&boot3d();fillQr();setTimeout(fillQr,1500);setTimeout(fillQr,4000);
  setTimeout(()=>{if(!T)document.body.classList.add('no-gl')},6000);
  if(splash.isConnected){setTimeout(()=>{splash.classList.add('out');try{sessionStorage.setItem('zs','1')}catch(e){}setTimeout(()=>splash.remove(),800)},800)}
});
setTimeout(()=>{if(splash.isConnected&&!splash.classList.contains('out')){splash.classList.add('out');setTimeout(()=>splash.remove(),800)}},5000);
setInterval(()=>$$('.open').forEach(el=>{el.outerHTML=openBadge()}),60000);
</script>
</body>
